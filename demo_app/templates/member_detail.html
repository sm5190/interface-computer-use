{% extends "base.html" %}
{% block title %}Member Inquiry{% endblock %}
{% block content %}
<h1>MEMBER INQUIRY</h1>
<table class="detail-table">
  <tr><td>MEMBER NUMBER:</td><td>{{ member.member_id }}</td></tr>
  <tr><td>NAME:</td><td>{{ member.name }}</td></tr>
  <tr><td>STATUS:</td><td>{{ member.status }}</td></tr>
  <tr><td>BRANCH:</td><td>{{ member.branch }}</td></tr>
</table>
<hr>
<table class="nav-table">
  <tr>
    <td>ACCOUNTS</td>
    <td>
      <form method="get" action="/members/{{ member.member_id }}/accounts">
        <button name="cmd_22" class="weak-button">&gt;</button>
      </form>
    </td>
  </tr>
  <tr><td>PROFILE</td><td><button class="weak-button" disabled>&gt;</button></td></tr>
</table>
{% endblock %}
