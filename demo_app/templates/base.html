<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>{% block title %}Heritage Core Banking{% endblock %}</title>
  <link rel="stylesheet" href="/static/legacy.css">
</head>
<body>
  <div class="terminal-shell">
    <div class="topbar">HERITAGE CORE BANKING SYSTEM <span>VERSION 7.4</span></div>
    {% if operator %}
    <div class="operatorbar">OPERATOR: {{ operator }} &nbsp;|&nbsp; TRAINING / LOCAL</div>
    {% endif %}
    {% block content %}{% endblock %}
    {% if operator %}
    <div class="footerkeys">
      <a class="footer-key" href="/help">F1 HELP</a>
      <button type="button" class="footer-key" onclick="legacyClear()">F3 CLEAR</button>
      <form method="post" action="/logout" class="inline-form">
        <button type="submit" class="footer-key">F12 EXIT</button>
      </form>
    </div>
    {% endif %}
  </div>
  <script>
    function legacyClear() {
      const form = document.querySelector('form:not(.inline-form)');
      if (form) {
        form.reset();
        const first = form.querySelector('input:not([type="hidden"]), select, textarea');
        if (first) first.focus();
        return;
      }
      window.location.href = '/members';
    }
  </script>
</body>
</html>
