[project]
name = "interface-computer-use"
version = "0.1.0"
description = "Interface.ai take-home: computer-use capability automation system"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.116.0",
  "uvicorn[standard]>=0.35.0",
  "jinja2>=3.1.6",
  "python-multipart>=0.0.20",
  "itsdangerous>=2.2.0",
]

[dependency-groups]
dev = [
  "pytest>=8.4.0",
  "httpx>=0.28.1",
  "ruff>=0.12.0",
  "mypy>=1.17.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.mypy]
python_version = "3.12"
warn_unused_configs = true
check_untyped_defs = true
